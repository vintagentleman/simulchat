<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Simulchat</title>
		<meta property="og:description" content="Two people, one link, live typing and no history." />
		<meta property="og:title" content="Simulchat" />
		<meta property="og:type" content="website" />
		<meta name="color-scheme" content="light dark" />
		<meta name="description" content="Two people, one link, live typing and no history." />
		<script>
			try {
				const theme = localStorage.getItem('theme');
				if (theme === 'light' || theme === 'dark') {
					document.documentElement.classList.add('theme-' + theme);
					document.querySelector('meta[name="color-scheme"]').setAttribute('content', theme);
				}
			} catch {
				/* storage blocked — fall back to the system scheme */
			}
		</script>
		<script type="module" src="/src/app.ts"></script>
	</head>
	<body>
		<main id="app">
			<noscript>This chat needs JavaScript.</noscript>
		</main>

		<template id="tpl-topbar">
			<header class="topbar">
				<div class="app-id">
					<h1 class="app-title"><a href="./" data-i18n="appTitle"></a></h1>
					<p class="app-tagline" data-i18n="tagline"></p>
				</div>
				<div class="topbar-actions">
					<div class="lang-toggle" role="group" aria-label="Language / Язык">
						<button type="button" class="lang" data-lang="en">EN</button>
						<button type="button" class="lang" data-lang="ru">RU</button>
					</div>
					<div class="theme-toggle" role="group" data-i18n-aria="theme">
						<button
							type="button"
							class="theme"
							data-theme-choice="system"
							data-i18n-aria="themeSystem"
						>
							<svg viewBox="0 0 16 16" width="16" height="16">
								<circle
									cx="8"
									cy="8"
									r="6.4"
									fill="none"
									stroke="currentColor"
									stroke-width="1.3"
								/>
								<path fill="currentColor" d="M8 1.6a6.4 6.4 0 000 12.8z" />
							</svg>
						</button>
						<button type="button" class="theme theme-pin" data-theme-choice="pin">
							<svg class="i-sun" viewBox="0 0 16 16" width="16" height="16">
								<circle cx="8" cy="8" r="3.2" fill="currentColor" />
								<g stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
									<line x1="8" y1="1" x2="8" y2="2.6" />
									<line x1="8" y1="13.4" x2="8" y2="15" />
									<line x1="1" y1="8" x2="2.6" y2="8" />
									<line x1="13.4" y1="8" x2="15" y2="8" />
									<line x1="3.1" y1="3.1" x2="4.2" y2="4.2" />
									<line x1="11.8" y1="11.8" x2="12.9" y2="12.9" />
									<line x1="3.1" y1="12.9" x2="4.2" y2="11.8" />
									<line x1="11.8" y1="4.2" x2="12.9" y2="3.1" />
								</g>
							</svg>
							<svg class="i-moon" viewBox="0 0 16 16" width="16" height="16">
								<path fill="currentColor" d="M6.2 2.3a6 6 0 107.5 7.5A5 5 0 016.2 2.3z" />
							</svg>
						</button>
					</div>
					<a
						class="gh-link"
						href="https://github.com/vintagentleman/simulchat"
						target="_blank"
						rel="noopener"
						aria-label="GitHub"
					>
						<svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor" aria-hidden="true">
							<path
								d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
							/>
						</svg>
					</a>
				</div>
			</header>
		</template>

		<template id="tpl-landing">
			<section class="page landing">
				<p class="note bad-link" data-i18n="badLink" hidden></p>
				<p class="intro" data-i18n="intro"></p>
				<button type="button" id="start" data-i18n="start"></button>
			</section>
		</template>

		<template id="tpl-line">
			<section class="page line">
				<div class="status" role="status">
					<p class="status-text"></p>
					<div class="invite" hidden>
						<input class="invite-link" type="text" readonly data-i18n-aria="linkLabel" />
						<button type="button" id="copy-link" class="ghost" data-i18n="copyLink"></button>
						<button
							type="button"
							id="share-link"
							class="ghost"
							data-i18n="shareLink"
							hidden
						></button>
					</div>
					<button type="button" id="retry" data-i18n="retry" hidden></button>
				</div>
				<p class="pane-label" id="mirror-label" data-i18n="them"></p>
				<div class="mirror" role="region" aria-labelledby="mirror-label"></div>
				<label class="pane-label" for="composer" data-i18n="you"></label>
				<textarea
					id="composer"
					class="composer"
					maxlength="2000"
					rows="4"
					autocomplete="off"
				></textarea>
				<div class="controls">
					<button type="button" id="erase" data-i18n="erase"></button>
					<div class="send-key" role="group" data-i18n-aria="eraseKey">
						<button type="button" data-send-key="enter">Enter</button>
						<button type="button" data-send-key="ctrlEnter">Ctrl+Enter</button>
					</div>
					<p class="hint"></p>
				</div>
			</section>
		</template>
	</body>
</html>
